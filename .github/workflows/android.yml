name: Build fork APK (FOSS, arm64)

on:
  workflow_dispatch:
  push:
    branches:
      - 'dev'
      - 'main'
    paths-ignore:
      - 'README.md'
      - 'fastlane/**'
      - 'assets/**'
      - '.github/**/*.md'
      - '.github/FUNDING.yml'
      - '.github/ISSUE_TEMPLATE/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: 'recursive'

      - name: set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: "microsoft"
          cache: 'gradle'

      # Fork: Gradle's own build cache (~/.gradle/caches/build-cache-1). It is what makes a rebuild
      # cheap: `core` is a submodule and does not change between our commits, so its compiled
      # outputs are restored instead of recompiled. The key changes only when the version catalog
      # or the submodule's scripts do, and restore-keys keeps the previous cache as the seed.
      - name: Restore Gradle build cache
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches/build-cache-1
          key: gradle-buildcache-${{ hashFiles('gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties', 'core/**/*.gradle.kts', 'core/gradle/libs.versions.toml') }}
          restore-keys: |
            gradle-buildcache-

      - name: Force FOSS build
        run: |
          sed -i 's/^isFullBuild=.*/isFullBuild=false/' ./gradle.properties
          grep -q '^isFullBuild=' ./gradle.properties || echo 'isFullBuild=false' >> ./gradle.properties
          grep '^isFullBuild=' ./gradle.properties

      - name: Read version
        id: ver
        run: echo "name=$(grep '^version-name' gradle/libs.versions.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"

      - name: Generate aboutLibraries.json
        run: ./gradlew exportLibraryDefinitions

      - name: Build release APK
        run: ./gradlew androidApp:assembleRelease

      - name: Sign APK
        run: |
          set -e
          BT=$(ls /usr/local/lib/android/sdk/build-tools/ | sort -V | tail -n 1)
          ZA="/usr/local/lib/android/sdk/build-tools/$BT/zipalign"
          AS="/usr/local/lib/android/sdk/build-tools/$BT/apksigner"
          APK=$(ls androidApp/build/outputs/apk/release/*.apk | head -n 1)
          echo "Signing $APK with build-tools $BT"
          # A PERMANENT keystore, kept in repository secrets. It used to be generated per run, which
          # made every release signed by a different key — so no build could ever update over the one
          # before it. Do not replace it with an ephemeral key again: losing or rotating this key
          # means the next release can only be installed after a full uninstall.
          echo "${{ secrets.FORK_KEYSTORE_B64 }}" | base64 -d > fork.keystore
          "$ZA" -v 4 "$APK" aligned.apk
          "$AS" sign --ks fork.keystore \
            --ks-pass pass:${{ secrets.FORK_KEYSTORE_PASSWORD }} \
            --key-pass pass:${{ secrets.FORK_KEY_PASSWORD }} \
            --ks-key-alias ${{ secrets.FORK_KEY_ALIAS }} \
            --out SimpMusic-FOSS-arm64.apk aligned.apk
          "$AS" verify --verbose SimpMusic-FOSS-arm64.apk
          "$AS" verify --print-certs SimpMusic-FOSS-arm64.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SimpMusic-FOSS-arm64
          path: SimpMusic-FOSS-arm64.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: fork-v${{ steps.ver.outputs.name }}-${{ github.run_number }}
          name: SimpMusic FOSS ${{ steps.ver.outputs.name }} (fork build ${{ github.run_number }})
          body: |
            FOSS build, arm64-v8a only.
            Upstream version: ${{ steps.ver.outputs.name }}
            Commit: ${{ github.sha }}
          files: SimpMusic-FOSS-arm64.apk
